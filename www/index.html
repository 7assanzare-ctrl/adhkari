<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أذكاري</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f1;--card:#fff;--tx:#1a1c1a;--mut:#6a706a;--ac:#1f9d55;--red:#b3202a;--bar:#d5d8d3;--bd:#e2e4df;--inp:#f3f4f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111211;--card:#1d1e1f;--tx:#f1efe9;--mut:#9a9f99;--bar:#3a3c3a;--bd:#2a2c2a;--inp:#161716}}
:root[data-theme="dark"]{--bg:#111211;--card:#1d1e1f;--tx:#f1efe9;--mut:#9a9f99;--bar:#3a3c3a;--bd:#2a2c2a;--inp:#161716}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;z-index:5}
.row{display:flex;gap:8px;align-items:center}
.tabs{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;background:var(--card);border-radius:14px;padding:3px;border:1px solid var(--bd);scrollbar-width:none}
.tabs button{flex:0 0 auto;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:9px 14px;border-radius:11px;cursor:pointer;white-space:nowrap}
.tabs .add{color:var(--ac)}
#csv{background:var(--ac);color:#fff}#ccn{background:var(--bar);color:var(--tx)}#cdel{background:var(--card);color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.tabs button.on{background:var(--ac);color:#fff}
.ic{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:.85rem;border-radius:12px;padding:10px 12px;cursor:pointer}
.ic.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.prog{display:flex;gap:4px;margin-top:10px}
.seg{flex:1;height:5px;border-radius:3px;background:var(--bar)}
.seg.on{background:var(--ac)}.seg.cur{background:var(--mut)}.seg.on.cur{background:var(--ac)}
main{padding:8px 14px 110px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;margin-bottom:14px;overflow:hidden}
.tools{display:flex;gap:2px;padding:6px 8px 0;justify-content:flex-start}
.tools button{border:0;background:none;color:var(--mut);font:inherit;font-size:.8rem;padding:6px 8px;cursor:pointer;border-radius:8px}
.tools button.arm{color:var(--red);font-weight:700}
.txt{font-family:Amiri,"Noto Naskh Arabic","Traditional Arabic",serif;font-size:1.6rem;line-height:2.1;text-align:center;padding:6px 16px;white-space:pre-wrap}
.note{color:var(--mut);font-size:.85rem;text-align:center;padding:2px 16px 14px;line-height:1.8}
.cnt{display:block;width:100%;border:0;background:var(--red);color:#fff;font:inherit;font-size:1.6rem;font-weight:700;padding:15px;cursor:pointer}
.cnt.done{background:var(--ac)}
.ses .txt{font-size:2rem;min-height:38vh;display:flex;align-items:center;justify-content:center}
.ses .card{cursor:pointer;user-select:none}
.nav{display:flex;align-items:center;justify-content:space-between;color:var(--mut);margin-top:6px}
.nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;border-radius:12px;padding:10px 18px;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:70px 20px;line-height:2}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:18px;border:0;background:var(--ac);color:#fff;font-size:2rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:1.1rem}
.sheet label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
.sheet textarea,.sheet input{width:100%;background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font:inherit;font-size:1rem}
.sheet textarea{min-height:130px;resize:vertical;font-family:Amiri,serif;font-size:1.25rem;line-height:1.9}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;cursor:pointer}
#sv{background:var(--ac);color:#fff}#cn{background:var(--bar);color:var(--tx)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="tabs" id="tabs"></div>
    <button class="ic" id="bm" title="خيارات القسم">⋮</button>
    <button class="ic" id="bs">جلسة</button>
    <button class="ic" id="br" title="إعادة العدّ">↺</button>
  </div>
  <div class="prog" id="prog"></div>
</header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="إضافة ذكر">+</button>

<div class="ov" id="ov">
  <div class="sheet">
    <h2 id="sh">إضافة ذكر</h2>
    <label for="f-txt">نص الذكر</label>
    <textarea id="f-txt"></textarea>
    <label for="f-n">عدد التكرار</label>
    <input id="f-n" type="number" min="1" value="1" inputmode="numeric">
    <label for="f-note">الفضل أو ملاحظة (اختياري)</label>
    <input id="f-note" type="text">
    <div class="acts"><button id="sv">حفظ</button><button id="cn">إلغاء</button></div>
  </div>
</div>

<div class="ov" id="cov">
  <div class="sheet">
    <h2 id="csh">قسم جديد</h2>
    <label for="c-name">اسم القسم</label>
    <input id="c-name" type="text" placeholder="مثال: أذكار النوم">
    <div class="acts"><button id="csv">حفظ</button><button id="ccn">إلغاء</button><button id="cdel">حذف القسم</button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const DEF=[['morning','أذكار الصباح'],['evening','أذكار المساء'],['sleep','أذكار النوم'],['leave','أذكار الخروج من المنزل'],['travel','أذكار السفر']].map(([id,name])=>({id,name}));
let S={tab:'evening',cats:DEF.map(c=>({...c})),items:{},counts:{},v:2};
let ses=false,idx=0,editId=null,arm=null;
try{const d=JSON.parse(localStorage.getItem('adhkar')||'null');if(d){S.tab=d.tab||S.tab;S.items=d.items||S.items;S.counts=d.counts||{};S.seed=!!d.seed;S.cats=d.cats||S.cats;if(d.v!==2){DEF.forEach(c=>{if(!S.cats.find(x=>x.id===c.id))S.cats.push({...c})});S.v=2}}}catch(e){}
if(!S.cats.find(c=>c.id===S.tab))S.tab=S.cats[0].id;
const save=()=>{try{localStorage.setItem('adhkar',JSON.stringify(S))}catch(e){}};
const list=()=>S.items[S.tab]||(S.items[S.tab]=[]);
let _i=0;const sp=(t,n=1,note='')=>({id:'s'+(++_i),t,n,note});
const K='اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ';
const I='قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ';
const F='قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِنْ شَرِّ مَا خَلَقَ، وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ';
const N='قُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَٰهِ النَّاسِ، مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ، مِنَ الْجِنَّةِ وَالنَّاسِ';
const mk=m=>{const w=(a,b)=>m?a:b,x=w('هَذَا الْيَوْمِ','هَذِهِ اللَّيْلَةِ'),y=w('بَعْدَهُ','بَعْدَهَا');return[
sp(K,1,w('من قالها حين يصبح حُفظ حتى يمسي','من قالها حين يمسي حُفظ حتى يصبح')),
sp(I,3,'من قالها ثلاثًا حين يصبح وحين يمسي كفته من كل شيء (أبو داود والترمذي)'),sp(F,3),sp(N,3),
sp(`${w('أَصْبَحْنَا وَأَصْبَحَ','أَمْسَيْنَا وَأَمْسَى')} الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي ${x} وَخَيْرَ مَا ${y}، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي ${x} وَشَرِّ مَا ${y}، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ`,1,'رواه مسلم'),
sp(`اللَّهُمَّ بِكَ ${w('أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا','أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا')}، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ ${w('النُّشُورُ','الْمَصِيرُ')}`,1,'رواه الترمذي'),
sp('اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',1,'سيد الاستغفار. من قاله موقنًا به فمات من يومه أو ليلته دخل الجنة (البخاري)'),
sp('اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ',3,'رواه أبو داود'),
sp('حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',7,'كفاه الله ما أهمّه (أبو داود)'),
sp('رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا',3,'كان حقًّا على الله أن يرضيه يوم القيامة (أبو داود والترمذي)'),
sp('بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',3,'لم يضره شيء (أبو داود والترمذي)'),
sp('سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',100,'رواه مسلم')]};
const SD=()=>({morning:mk(true),evening:mk(false),
sleep:[sp(K,1,'لا يزال عليك من الله حافظ ولا يقربك شيطان حتى تصبح (البخاري)'),
sp(I,3,'اجمع كفّيك وانفث فيهما ثم اقرأ الإخلاص والمعوذتين، وامسح بهما جسدك. تُكرَّر ثلاث مرات (البخاري)'),sp(F,3),sp(N,3),
sp('آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ. لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ',1,'من قرأهما في ليلة كفتاه (البخاري ومسلم)'),
sp('بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا',1,'رواه البخاري'),
sp('اللَّهُمَّ بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ',1,'رواه البخاري ومسلم'),
sp('اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ',3,'رواه أبو داود والترمذي'),
sp('سُبْحَانَ اللَّهِ',33,'تسبيح فاطمة رضي الله عنها (البخاري ومسلم)'),sp('الْحَمْدُ لِلَّهِ',33),sp('اللَّهُ أَكْبَرُ',34)],
leave:[sp('بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ',1,'يقال له: كُفيت ووُقيت وتنحّى عنه الشيطان (أبو داود والترمذي)'),
sp('اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ، أَوْ أَزِلَّ أَوْ أُزَلَّ، أَوْ أَظْلِمَ أَوْ أُظْلَمَ، أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَيَّ',1,'رواه أبو داود والترمذي')],
travel:[sp('اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ. اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى، اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ وَالْخَلِيفَةُ فِي الْأَهْلِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ وَكَآبَةِ الْمَنْظَرِ وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ',1,'دعاء ركوب السفر (مسلم)'),
sp('آيِبُونَ تَائِبُونَ عَابِدُونَ لِرَبِّنَا حَامِدُونَ',1,'يُقال بعد دعاء السفر عند الرجوع (مسلم)'),
sp('أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ',1,'عند النزول في مكان: لم يضره شيء حتى يرتحل (مسلم)')]});
if(!S.seed){const sd=SD();S.cats.forEach(c=>{if(sd[c.id]&&!(S.items[c.id]||[]).length)S.items[c.id]=sd[c.id]});S.seed=true;save()}
const cnt=it=>S.counts[it.id]||0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(it){
  const c=cnt(it),done=c>=it.n;
  return `<div class="card" data-id="${it.id}">
  <div class="tools"><button data-a="share">مشاركة</button><button data-a="edit">تعديل</button><button data-a="del" class="${arm===it.id?'arm':''}">${arm===it.id?'تأكيد الحذف؟':'حذف'}</button></div>
  <div class="txt">${esc(it.t)}</div>${it.note?`<div class="note">${esc(it.note)}</div>`:''}
  <button class="cnt ${done?'done':''}" data-a="inc">${c} / ${it.n}</button></div>`;
}
function render(){
  const L=list();
  if(idx>=L.length)idx=Math.max(0,L.length-1);
  $('#tabs').innerHTML=S.cats.map(c=>`<button data-c="${c.id}" class="${S.tab===c.id?'on':''}">${esc(c.name)}</button>`).join('')+'<button class="add" data-c="+">+ قسم</button>';
  const on=$('#tabs .on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
  $('#bs').classList.toggle('on',ses);
  $('#prog').innerHTML=L.map((it,i)=>`<div class="seg ${cnt(it)>=it.n?'on':''} ${ses&&i===idx?'cur':''}"></div>`).join('');
  const m=$('#main');m.className=ses?'ses':'';
  if(!L.length){m.innerHTML='<div class="empty">ما فيش أذكار هنا لسه.<br>اضغط + لإضافة أول ذكر.</div>';return}
  if(ses){
    m.innerHTML=card(L[idx])+`<div class="nav"><button data-a="prev">السابق</button><span>${idx+1} / ${L.length}</span><button data-a="next">التالي</button></div>`;
  }else m.innerHTML=L.map(card).join('');
}
function inc(id){
  const L=list(),i=L.findIndex(x=>x.id===id);if(i<0)return;
  const it=L[i];if(cnt(it)>=it.n)return;
  S.counts[id]=cnt(it)+1;save();
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  render();
  if(ses&&cnt(it)>=it.n&&i<L.length-1)setTimeout(()=>{if(idx===i){idx=i+1;render()}},280);
}
async function share(it){
  const txt=it.t+(it.note?'\n'+it.note:'');
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){return}
  try{await navigator.clipboard.writeText(txt)}catch(e){}
}
function openSheet(it){
  editId=it?it.id:null;
  $('#sh').textContent=it?'تعديل الذكر':'إضافة ذكر';
  $('#f-txt').value=it?it.t:'';$('#f-n').value=it?it.n:1;$('#f-note').value=it?it.note||'':'';
  $('#ov').classList.add('show');setTimeout(()=>$('#f-txt').focus(),50);
}
const closeSheet=()=>$('#ov').classList.remove('show');
$('#sv').onclick=()=>{
  const t=$('#f-txt').value.trim();if(!t){$('#f-txt').focus();return}
  const n=Math.max(1,parseInt($('#f-n').value)||1),note=$('#f-note').value.trim();
  if(editId){const it=list().find(x=>x.id===editId);if(it){it.t=t;it.n=n;it.note=note}}
  else list().push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t,n,note});
  save();closeSheet();render();
};
$('#cn').onclick=closeSheet;
$('#ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};
$('#fab').onclick=()=>openSheet();
$('#bs').onclick=()=>{ses=!ses;arm=null;render()};
$('#br').onclick=()=>{list().forEach(it=>delete S.counts[it.id]);idx=0;save();render()};
let catEdit=null;
function openCat(id){
  catEdit=id;const c=S.cats.find(x=>x.id===id);
  $('#csh').textContent=c?'خيارات القسم':'قسم جديد';
  $('#c-name').value=c?c.name:'';
  const d=$('#cdel');d.style.display=c&&S.cats.length>1?'':'none';d.textContent='حذف القسم';
  $('#cov').classList.add('show');setTimeout(()=>$('#c-name').focus(),50);
}
const closeCat=()=>$('#cov').classList.remove('show');
$('#tabs').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.c==='+')return openCat(null);
  S.tab=b.dataset.c;idx=0;arm=null;save();render();
};
$('#bm').onclick=()=>openCat(S.tab);
$('#ccn').onclick=closeCat;
$('#cov').onclick=e=>{if(e.target.id==='cov')closeCat()};
$('#csv').onclick=()=>{
  const n=$('#c-name').value.trim();if(!n){$('#c-name').focus();return}
  if(catEdit)S.cats.find(x=>x.id===catEdit).name=n;
  else{const id='c'+Date.now().toString(36);S.cats.push({id,name:n});S.items[id]=[];S.tab=id;idx=0}
  save();closeCat();render();
};
$('#cdel').onclick=function(){
  if(this.textContent==='حذف القسم'){this.textContent='تأكيد حذف القسم وأذكاره؟';return}
  (S.items[catEdit]||[]).forEach(it=>delete S.counts[it.id]);
  delete S.items[catEdit];S.cats=S.cats.filter(x=>x.id!==catEdit);
  S.tab=S.cats[0].id;idx=0;arm=null;save();closeCat();render();
};
$('#main').onclick=e=>{
  const b=e.target.closest('button[data-a]'),c=e.target.closest('.card'),a=b&&b.dataset.a;
  const it=c&&list().find(x=>x.id===c.dataset.id);
  if(a==='inc')inc(it.id);
  else if(a==='share')share(it);
  else if(a==='edit')openSheet(it);
  else if(a==='del'){
    if(arm===it.id){S.items[S.tab]=list().filter(x=>x.id!==it.id);delete S.counts[it.id];arm=null;save()}
    else arm=it.id;
    render();
  }
  else if(a==='prev'){idx=Math.max(0,idx-1);render()}
  else if(a==='next'){idx=Math.min(list().length-1,idx+1);render()}
  else if(ses&&it)inc(it.id);
};
render();
</script>
</body>
</html>
